<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陽部｜上古漢語</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background:#f8f5ee;
    color:#3c3327;
    font-family:"MingLiU","SimSun","Noto Serif CJK SC",serif;
    padding:32px 16px;
}
.container{
    max-width:1000px;
    margin:0 auto;
}
.topbar{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:24px;
    flex-wrap:wrap;
}
.back{
    padding:8px 16px;
    border:1px solid #c9bcaa;
    background:#fffdf8;
    color:#4b3a28;
    text-decoration:none;
    /*导航链接允许选中关闭*/
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
}
.back:hover{
    background:#f5ede0;
}
.search-wrap{
    width:100%;
    margin-bottom:16px;
}
#search-input{
    width:100%;
    padding:10px 14px;
    border:1px solid #c9bcaa;
    background:#fffdf8;
    font-family:"MingLiU","SimSun",serif;
    font-size:16px;
    /*输入框必须允许选中文本*/
    -webkit-user-select:text;
    -moz-user-select:text;
    -ms-user-select:text;
    user-select:text;
}
h2{
    font-weight:normal;
    letter-spacing:0.2em;
    color:#523f2b;
}
table{
    width:100%;
    border-collapse:collapse;
    background:#fffdf8;
    box-shadow:0 2px 12px rgba(92,68,38,0.08);
    border:1px solid #ddd6c9;
    /*表格整体禁止拖拽选字*/
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
}
th,td{
    padding:14px 10px;
    border:1px solid #e2d9cc;
    text-align:center;
}
th{
    background:#efe8dc;
    color:#584430;
    font-weight:normal;
    letter-spacing:0.1em;
}
tr:nth-child(even){
    background:#fcf9f3;
}
tr:hover{
    background:#f5ede0;
    transition:0.22s;
}
.phon{
    font-family:"Times New Roman","Segoe UI Symbol",serif;
    font-style:italic;
    letter-spacing:0.06em;
}
/*复制提示浮层*/
.toast{
    position:fixed;
    left:50%;
    top:20px;
    transform:translateX(-50%);
    background:#222;
    color:#fff;
    padding:6px 14px;
    border-radius:4px;
    z-index:999;
    opacity:0;
    pointer-events:none;
    transition:0.2s;
}
.toast.show{
    opacity:0.85;
}
@media print{
    body{background:#fff;}
    table{box-shadow:none;}
    .back{display:none;}
    .search-wrap{display:none;}
    .toast{display:none;}
}
</style>
</head>
<body>
<div class="container">
    <div class="topbar">
        <a class="back" href="index.html">← 返回主頁</a>
    </div>
    <div class="search-wrap">
        <input id="search-input" placeholder="漢字｜擬音IPA｜聲母" type="text">
    </div>
<table>
  <thead>
    <tr>
      <th>漢字</th>
      <th>擬音</th>
      <th>聲母</th>
    </tr>
  </thead>
  <tbody id="tbl-body">
  </tbody>
</table>
</div>
<div class="toast" id="toast"></div>
<script>
let rowList = [];
const toast = document.getElementById("toast");

function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"),1100);
}

window.addEventListener("load", ()=>{
    fetch("dict.xml")
    .then(resp=>resp.text())
    .then(xmltext=>{
        const parser=new DOMParser();
        const xml=parser.parseFromString(xmltext,"text/xml");
        const words=xml.querySelectorAll("word");
        rowList = [];
        words.forEach(w=>{
            rowList.push({
                char:w.getAttribute("char"),
                ipa:w.getAttribute("ipa"),
                sm:w.getAttribute("sm")
            });
        });
        renderTable("");
    })
    .catch(err=>{
        alert("載入詞庫失敗！\n"+err);
    });
    const input = document.getElementById("search-input");
    input.addEventListener("input",(e)=>{
        const kw = e.target.value.trim();
        renderTable(kw);
    });
});
function renderTable(keyword){
    const tblBody = document.getElementById("tbl-body");
    let html = "";
    const k = keyword.toLowerCase();
    rowList.forEach(item=>{
        const c = item.char ?? "";
        const i = item.ipa ?? "";
        const s = item.sm ?? "";
        if(keyword === ""
            || c.includes(keyword)
            || i.toLowerCase().includes(k)
            || s.toLowerCase().includes(k))
        {
            html+=`<tr>
<td data-dblcopy="${c}">${c}</td>
<td class="phon" data-dblcopy="${i}">${i}</td>
<td data-dblcopy="${s}">${s}</td>
</tr>`;
        }
    });
    tblBody.innerHTML=html;
    tblBody.querySelectorAll("td[data-dblcopy]").forEach(td=>{
        td.ondblclick = async function(){
            const text = this.dataset.dblcopy;
            try{
                await navigator.clipboard.writeText(text);
                showToast(`已複製：${text}`);
            }catch(err){
                showToast("複製失敗");
            }
        }
    });
}
</script>
</body>
</html>
