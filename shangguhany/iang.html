<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陽部｜上古漢語</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background:#f8f5ee;
    color:#3c3327;
    font-family:"MingLiU","SimSun","Noto Serif CJK SC",serif;
    padding:32px 16px;
}
.container{
    max-width:1000px;
    margin:0 auto;
}
.topbar{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:24px;
    flex-wrap:wrap;
}
.back{
    padding:8px 16px;
    border:1px solid #c9bcaa;
    background:#fffdf8;
    color:#4b3a28;
    text-decoration:none;
}
.back:hover{
    background:#f5ede0;
}
h2{
    font-weight:normal;
    letter-spacing:0.2em;
    color:#523f2b;
}
table{
    width:100%;
    border-collapse:collapse;
    background:#fffdf8;
    box-shadow:0 2px 12px rgba(92,68,38,0.08);
    border:1px solid #ddd6c9;
}
th,td{
    padding:14px 10px;
    border:1px solid #e2d9cc;
    text-align:center;
}
th{
    background:#efe8dc;
    color:#584430;
    font-weight:normal;
    letter-spacing:0.1em;
}
tr:nth-child(even){
    background:#fcf9f3;
}
tr:hover{
    background:#f5ede0;
    transition:0.22s;
}
.phon{
    font-family:"Times New Roman","Segoe UI Symbol",serif;
    font-style:italic;
    letter-spacing:0.06em;
}
@media print{
    body{background:#fff;}
    table{box-shadow:none;}
    .back{display:none;}
}
</style>
</head>
<body>
<div class="container">
    <div class="topbar">
        <a class="back" href="index.html">← 返回主頁</a>
    </div>
<table>
  <thead>
    <tr>
      <th>漢字</th>
      <th>擬音</th>
      <th>聲母</th>
    </tr>
  </thead>
  <tbody id="tbl-body">
  </tbody>
</table>
</div>
<script>
window.addEventListener("load", ()=>{
    fetch("dict.xml")
    .then(resp=>resp.text())
    .then(xmltext=>{
        const parser=new DOMParser();
        const xml=parser.parseFromString(xmltext,"text/xml");
        const words=xml.querySelectorAll("word");
        let html="";
        words.forEach(w=>{
            const char=w.getAttribute("char");
            const ipa=w.getAttribute("ipa");
            const sm=w.getAttribute("sm");
            html+=`<tr>
<td>${char}</td>
<td class="phon">${ipa}</td>
<td>${sm}</td>
</tr>`;
        });
        document.getElementById("tbl-body").innerHTML=html;
    })
    .catch(err=>{
        alert("載入詞庫失敗！\n"+err);
    });
});
</script>
</body>
</html>
